name: Rimmile Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    env:
      VITE_ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read existing Pages location
        uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: false
      - run: npm ci
      - run: npm test
      - name: Require the prepared public asset origin
        run: node -e "if (!process.env.VITE_ASSET_BASE_URL?.startsWith('https://')) process.exit(1)"
      - run: npm run build
        env:
          VITE_PAGES_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
      - run: npm run audit:release
      - name: Verify assets before activating the frontend
        run: npm run smoke:assets
      - uses: actions/upload-pages-artifact@v3
        if: vars.RELEASE_APPROVED == 'true'
        with:
          path: dist/frontend
  deploy:
    if: vars.RELEASE_APPROVED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
